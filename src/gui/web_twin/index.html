<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAS Mission Control | AI Sequence Validation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #071013;
      --panel-bg: #0b171c;
      --panel-border: #142c33;
      --accent-cyan: #42f5e0;
      --accent-cyan-glow: rgba(66, 245, 224, 0.3);
      --accent-cyan-bg: rgba(66, 245, 224, 0.1);
      --text-main: #ffffff;
      --text-muted: #8ca5af;
      --text-dark: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
      align-items: center;
    }

    /* Main Container acting as the application window */
    .app-container {
      width: 100%;
      max-width: 1400px;
      background: var(--panel-bg);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .brand .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Header Controls */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-btn {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pill-btn:hover {
      color: #fff;
      border-color: #fff;
    }
    .pill-btn.active {
      background: var(--accent-cyan);
      color: var(--text-dark);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px var(--accent-cyan-glow);
    }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: 10px;
    }
    .reset-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    /* Main Content Layout */
    main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      align-items: start;
    }

    /* Left Column: Video & Actions */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .video-card {
      background: #000;
      border: 2px solid var(--accent-cyan);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px var(--accent-cyan-glow);
      display: flex;
      flex-direction: column;
    }

    .video-header {
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      width: 100%;
      z-index: 10;
    }
    .video-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .header-dots {
      color: var(--text-muted);
      font-size: 1.2rem;
      line-height: 1;
    }

    .video-frame {
      position: relative;
      width: 100%;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Action Panels */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .action-card {
      background: linear-gradient(180deg, rgba(20, 44, 51, 0.6) 0%, rgba(11, 23, 28, 0.6) 100%);
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 0 15px var(--accent-cyan-glow);
    }

    .action-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
    }
    .action-tag {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
    }
    
    .action-val {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      min-height: 40px;
    }

    /* Right Sidebar: Checklist */
    .checklist-card {
      background: transparent;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .checklist-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .checklist-body {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    /* Vertical line connecting steps */
    .checklist-body::before {
      content: '';
      position: absolute;
      left: 31px;
      top: 36px;
      bottom: 40px;
      width: 2px;
      background: var(--panel-border);
      z-index: 1;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      position: relative;
      z-index: 2;
    }
    
    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 2px solid var(--text-muted);
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .step-icon svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--panel-bg);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    /* Active Step */
    .step-item.active .step-icon {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan-glow);
    }
    
    /* Completed Step */
    .step-item.completed .step-icon {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }
    .step-item.completed .step-icon svg {
      opacity: 1;
    }

    .step-text {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .step-item.active .step-text,
    .step-item.completed .step-text {
      color: #fff;
    }

  </style>
</head>
<body>

<div class="app-container">
  <!-- Clean Top Bar -->
  <header>
    <div class="brand">
      <span class="subtitle">BHARATIYA ANTARIKSH STATION</span>
      <h1>AI SEQUENCE VALIDATION</h1>
    </div>

    <!-- Central Controls: Primary Experiments & Reset -->
    <div class="header-controls">
      <button class="pill-btn active" id="btn-ry" onclick="selectFeed('red_yellow')">RED-YELLOW EXPERIMENT</button>
      <button class="pill-btn" id="btn-cam" onclick="selectFeed('cam')">LIVE WEBCAM</button>
      <button class="pill-btn" id="btn-box" onclick="selectFeed('box_return')">BOX RETURN</button>
      
      <button class="reset-btn" id="btn-restart" onclick="restartTestSequence()">RESET ↺</button>
    </div>
  </header>

  <!-- Main Hero Grid -->
  <main>
    <!-- Left Column: Video Hero & Action Guidance -->
    <div class="left-col">
      <div class="video-card">
        <div class="video-header">
          <div class="video-title" id="feed-title-text">ISRO RED-YELLOW EXPERIMENT FEED</div>
          <div class="header-dots">...</div>
        </div>
        <div class="video-frame" id="stream-box">
          <img id="live-stream" src="/stream" alt="Real-Time Detection Stream">
        </div>
      </div>

      <!-- Action & Guidance Strip -->
      <div class="action-grid">
        <div class="action-card">
          <div class="action-header">
            <div class="action-tag">CURRENT DETECTED ACTION</div>
            <div class="header-dots">...</div>
          </div>
          <div class="action-val" id="action-doing">OBSERVING WORKSPACE (IDLE)</div>
        </div>
        
        <div class="action-card">
          <div class="action-header">
            <div class="action-tag">NEXT REQUIRED ACTION</div>
            <div class="header-dots">...</div>
          </div>
          <div class="action-val" id="action-todo">System ready. Open the primary container box.</div>
        </div>
      </div>
    </div>

    <!-- Right Column: Step Checklist -->
    <div class="checklist-card">
      <div class="checklist-header">PROCEDURAL STEP CHECKLIST</div>
      <div class="checklist-body" id="step-checklist">
        <!-- Populated by JavaScript -->
      </div>
    </div>
  </main>
</div>

  <script>
    const streamImg = document.getElementById('live-stream');
    const feedTitle = document.getElementById('feed-title-text');
    const elDoing = document.getElementById('action-doing');
    const elTodo = document.getElementById('action-todo');
    const checklistBody = document.getElementById('step-checklist');

    let fallbackTimer = null;
    let activeExperimentId = "BAS-EXP-26174";

    const PROTOCOLS = {
      "BAS-EXP-26174": {
        name: "ISRO RED-YELLOW PROCEDURE (PS #26174)",
        steps: [
          { id: 0, title: "Standby / Box Closed" },
          { id: 1, title: "Open Container Box" },
          { id: 2, title: "Extract Red Box First" },
          { id: 3, title: "Extract Yellow Box Second" },
          { id: 4, title: "Return Yellow & Red Boxes" },
          { id: 5, title: "Close Box & Complete" }
        ]
      },
      "BAS-EXP-RED-YELLOW": {
        name: "ISRO RED-YELLOW PROCEDURE (PS #26174)",
        steps: [
          { id: 0, title: "Standby / Box Closed" },
          { id: 1, title: "Open Container Box" },
          { id: 2, title: "Extract Red Box First" },
          { id: 3, title: "Extract Yellow Box Second" },
          { id: 4, title: "Return Yellow & Red Boxes" },
          { id: 5, title: "Close Box & Complete" }
        ]
      },
      "BAS-EXP-BOX-RETURN": {
        name: "BOX RETURN PROCEDURE",
        steps: [
          { id: 0, title: "Initialize Workspace" },
          { id: 1, title: "Open Box" },
          { id: 2, title: "Take Out Object" },
          { id: 3, title: "Return Object" },
          { id: 4, title: "Close Box & Complete" }
        ]
      }
    };

    function renderChecklist(expId) {
      if (!PROTOCOLS[expId]) expId = "BAS-EXP-26174";
      activeExperimentId = expId;
      const proto = PROTOCOLS[expId];
      if (!checklistBody) return;

      checklistBody.innerHTML = proto.steps.map(s => `
        <div class="step-item ${s.id === 0 ? 'active' : ''}" id="step-${s.id}">
          <div class="step-icon">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <div class="step-text">${s.title}</div>
        </div>
      `).join('');
    }

    renderChecklist("BAS-EXP-26174");

    // Unified Feed Selector
    async function selectFeed(type) {
      const btnRy = document.getElementById('btn-ry');
      const btnCam = document.getElementById('btn-cam');
      const btnBox = document.getElementById('btn-box');

      if (btnRy) btnRy.className = (type === 'red_yellow') ? 'pill-btn active' : 'pill-btn';
      if (btnCam) btnCam.className = (type === 'cam') ? 'pill-btn active' : 'pill-btn';
      if (btnBox) btnBox.className = (type === 'box_return') ? 'pill-btn active' : 'pill-btn';

      try {
        if (type === 'red_yellow') {
          await fetch('/api/experiment?set=isro_dual&t=' + Date.now());
          await fetch('/api/source?set=red_yellow.mp4&t=' + Date.now());
          renderChecklist("BAS-EXP-26174");
        } else if (type === 'cam') {
          await fetch('/api/source?set=cam&t=' + Date.now());
        } else if (type === 'box_return') {
          await fetch('/api/experiment?set=box_return&t=' + Date.now());
          await fetch('/api/source?set=clip1.mp4&t=' + Date.now());
          renderChecklist("BAS-EXP-BOX-RETURN");
        }
        restartTestSequence();
      } catch (err) {
        console.error("Failed to select feed:", err);
      }
    }

    // Reset Test Sequence
    async function restartTestSequence() {
      try {
        await fetch('/reset?t=' + Date.now());
        const maxSteps = (PROTOCOLS[activeExperimentId] && PROTOCOLS[activeExperimentId].steps) ? PROTOCOLS[activeExperimentId].steps.length - 1 : 5;
        for (let i = 0; i <= maxSteps; i++) {
          const item = document.getElementById(`step-${i}`);
          if (!item) continue;
          if (i === 0) {
            item.className = 'step-item active';
          } else {
            item.className = 'step-item';
          }
        }
      } catch (err) {
        console.error("Reset error:", err);
      }
    }

    // Stream Setup with Fallback Polling
    function setupVideoStream() {
      if (!streamImg) return;
      streamImg.onerror = () => {
        if (!fallbackTimer) {
          fallbackTimer = setInterval(() => {
            const temp = new Image();
            temp.onload = () => { streamImg.src = temp.src; };
            temp.src = '/snapshot?t=' + Date.now();
          }, 50);
        }
      };
      streamImg.onload = () => {
        if (fallbackTimer && streamImg.src.includes('/stream')) {
          clearInterval(fallbackTimer);
          fallbackTimer = null;
        }
      };
    }
    setupVideoStream();

    // High-Frequency Real-Time Telemetry Sync (25 Hz)
    async function updateTelemetry() {
      try {
        const resp = await fetch('/telemetry?t=' + Date.now());
        if (!resp.ok) return;
        const data = await resp.json();
        if (!data || data.step === undefined) return;

        // Source & Title
        if (data.source_type) {
          const isCam = data.source_type === "LIVE_WEBCAM";
          const isRY = data.source_type === "RED_YELLOW" || String(data.source_type).includes("red_yellow");
          if (feedTitle) {
            feedTitle.textContent = isCam ? "LIVE CAMERA FEED" : (isRY ? "ISRO RED-YELLOW EXPERIMENT FEED" : "RECORDED DEMO FEED");
          }
        }

        // Checklist protocol sync
        if (data.experiment_id && data.experiment_id !== activeExperimentId) {
          renderChecklist(data.experiment_id);
        }

        const maxSteps = (PROTOCOLS[activeExperimentId] && PROTOCOLS[activeExperimentId].steps) ? PROTOCOLS[activeExperimentId].steps.length - 1 : 5;

        // What I Am Doing & Guidance
        const isComplete = (data.step >= maxSteps || data.step_name === "COMPLETE" || data.step_name === "BOX_CLOSED" || data.step_name === "DUAL_COMPLETE");

        if (elDoing) {
          if (isComplete) {
            elDoing.textContent = "PROCEDURE COMPLETED (NOMINAL)";
          } else if (data.what_i_am_doing) {
            elDoing.textContent = data.what_i_am_doing !== "IDLE" ? data.what_i_am_doing : "OBSERVING WORKSPACE (IDLE)";
          }
        }

        if (elTodo) {
          if (isComplete) {
            elTodo.textContent = "All experiment steps verified with 100% sequence compliance.";
          } else if (data.anomaly && data.anomaly !== "NONE") {
            elTodo.textContent = `ALERT: ${data.anomaly}`;
          } else if (data.what_i_have_to_do) {
            elTodo.textContent = data.what_i_have_to_do;
          }
        }

        // Checklist Progress
        for (let i = 0; i <= maxSteps; i++) {
          const item = document.getElementById(`step-${i}`);
          if (!item) continue;

          if (isComplete || i < data.step) {
            item.className = 'step-item completed';
          } else if (i === data.step) {
            item.className = 'step-item active';
          } else {
            item.className = 'step-item';
          }
        }

      } catch (err) {
        // Silent catch for smooth polling
      }
    }

    setInterval(updateTelemetry, 40);
  </script>
</body>
</html>
